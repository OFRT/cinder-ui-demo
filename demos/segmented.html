<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinder Base / 分段控件</title>
  <link rel="stylesheet" href="../dist/cinder-base.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body class="cin-body">
  <div class="cin-shell">
    <header class="cin-topbar">
      <span class="cin-topbar-title">Cinder Base</span>
      <span class="cin-badge">segmented</span>
      <span class="cin-caption">同 name 的原生 radio，选中态纯 CSS；脚本只同步 data-value 与方向键</span>
      <div class="cin-toolbar" style="margin-inline-start:auto">
        <button class="cin-btn" data-size="sm" data-variant="ghost" onclick="const r=document.documentElement; r.getAttribute('data-theme')==='ink' ? r.removeAttribute('data-theme') : r.setAttribute('data-theme','ink')">切换主题</button>
      </div>
    </header>

    <div class="cin-shell-body">
      <main class="cin-main">
        <section class="cin-section">
          <h2 class="cin-section-title">基础</h2>
          <div class="cin-stack">
            <div class="cin-field">
              <span class="cin-field-label">时间粒度</span>
              <div class="cin-segmented" data-segmented data-value="day" role="radiogroup" aria-label="时间粒度">
                <label class="cin-segmented-item"><input type="radio" name="granularity" value="day" checked><span class="cin-segmented-label">日</span></label>
                <label class="cin-segmented-item"><input type="radio" name="granularity" value="week"><span class="cin-segmented-label">周</span></label>
                <label class="cin-segmented-item"><input type="radio" name="granularity" value="month"><span class="cin-segmented-label">月</span></label>
                <label class="cin-segmented-item"><input type="radio" name="granularity" value="quarter"><span class="cin-segmented-label">季</span></label>
              </div>
              <span class="cin-field-help">Tab 进入后左右方向键切换，选中即同步</span>
            </div>

            <div class="cin-field">
              <span class="cin-field-label">带禁用项</span>
              <div class="cin-segmented" data-segmented data-value="list" role="radiogroup" aria-label="单据视图">
                <label class="cin-segmented-item"><input type="radio" name="docview" value="list" checked><span class="cin-segmented-label">列表</span></label>
                <label class="cin-segmented-item"><input type="radio" name="docview" value="board"><span class="cin-segmented-label">看板</span></label>
                <label class="cin-segmented-item"><input type="radio" name="docview" value="gantt" disabled><span class="cin-segmented-label">甘特</span></label>
              </div>
            </div>
          </div>
        </section>

        <section class="cin-section">
          <h2 class="cin-section-title">尺寸与布局</h2>
          <div class="cin-stack">
            <div class="cin-row">
              <div class="cin-segmented" data-size="sm" data-segmented role="radiogroup" aria-label="小号">
                <label class="cin-segmented-item"><input type="radio" name="size-sm" value="a" checked><span class="cin-segmented-label">全部</span></label>
                <label class="cin-segmented-item"><input type="radio" name="size-sm" value="b"><span class="cin-segmented-label">我负责</span></label>
              </div>
              <div class="cin-segmented" data-segmented role="radiogroup" aria-label="中号">
                <label class="cin-segmented-item"><input type="radio" name="size-md" value="a" checked><span class="cin-segmented-label">全部</span></label>
                <label class="cin-segmented-item"><input type="radio" name="size-md" value="b"><span class="cin-segmented-label">我负责</span></label>
              </div>
              <div class="cin-segmented" data-size="lg" data-segmented role="radiogroup" aria-label="大号">
                <label class="cin-segmented-item"><input type="radio" name="size-lg" value="a" checked><span class="cin-segmented-label">全部</span></label>
                <label class="cin-segmented-item"><input type="radio" name="size-lg" value="b"><span class="cin-segmented-label">我负责</span></label>
              </div>
            </div>
            <div class="cin-field">
              <span class="cin-field-label">撑满一行（data-block）</span>
              <div class="cin-segmented" data-block data-segmented role="radiogroup" aria-label="撑满">
                <label class="cin-segmented-item"><input type="radio" name="block-demo" value="in" checked><span class="cin-segmented-label">入库</span></label>
                <label class="cin-segmented-item"><input type="radio" name="block-demo" value="out"><span class="cin-segmented-label">出库</span></label>
                <label class="cin-segmented-item"><input type="radio" name="block-demo" value="move"><span class="cin-segmented-label">移库</span></label>
              </div>
            </div>
          </div>
        </section>

        <section class="cin-section">
          <h2 class="cin-section-title">API</h2>
          <div class="cin-row">
            <button class="cin-btn" data-size="sm" onclick="Cinder.setSegmented(document.querySelector('[data-segmented]'), 'month'); document.getElementById('out-seg').textContent = 'set -> ' + Cinder.segmented(document.querySelector('[data-segmented]')).value;">设为「月」</button>
            <button class="cin-btn" data-size="sm" data-variant="ghost" onclick="Cinder.setSegmented(document.querySelector('[data-segmented]'), 'not-exist'); document.getElementById('out-seg').textContent = '未知值 -> 保持 ' + Cinder.segmented(document.querySelector('[data-segmented]')).value;">赋值未知项</button>
            <span class="cin-caption" id="out-seg">value -> day</span>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script>
    document.querySelectorAll('[data-segmented]').forEach((el) => el.addEventListener('cin:segmentchange', (e) => {
      if (el.getAttribute('aria-label') !== '时间粒度') return;
      document.getElementById('out-seg').textContent = 'change -> ' + e.detail.value + '（' + e.detail.reason + '）';
    }));
  </script>
  <script src="../dist/cinder.js" defer></script>
</body>
</html>
